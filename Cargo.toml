[workspace]
members = [
    "crates/compiler",
    "crates/derive",
    "crates/gc-region",
    "crates/native",
    "crates/num",
    "crates/string",
    "crates/types",
    "crates/vm",
    "crates/scheme/*",
]
resolver = "3"

# Every crate but gc-region opts in. gc-region allows unsafe code in one file, for mapping memory
# and giving it back, so the collector and everything above it have none.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "forbid"
