[workspace]
members = [
    "crates/alloc",
    "crates/cli",
    "crates/compiler",
    "crates/derive",
    "crates/gc-region",
    "crates/native",
    "crates/num",
    "crates/modules-core",
    "crates/string",
    "crates/types",
    "crates/vm",
    "crates/scheme/*",
]
resolver = "3"

# Every crate but gc-region opts in. gc-region allows unsafe code in one file, for mapping memory
# and giving it back, so the collector and everything above it have none.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "forbid"

# no `std::ptr`, and no casts to raw pointers
disallowed_methods = "forbid"
disallowed_macros = "forbid"
disallowed_types = "forbid"
ref_as_ptr = "forbid"
borrow_as_ptr = "forbid"
fn_to_numeric_cast_any = "forbid"
