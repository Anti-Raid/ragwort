[package]
name = "ragwort-modules-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ragwort-types = { path = "../types", default-features = false }
ragwort-reader-scheme = { path = "../scheme/reader", default-features = false }
ragwort-vm = { path = "../vm", default-features = false }
ragwort-compiler = { path = "../compiler", default-features = false }
ragwort-native = { path = "../native", default-features = false }
ragwort-scheme = { path = "../scheme/base", default-features = false }

[dev-dependencies]
ragwort-printer-scheme = { path = "../scheme/printer", default-features = false }

[features]
default = ["mmap", "arena"]
mmap = ["ragwort-types/mmap", "ragwort-reader-scheme/mmap", "ragwort-vm/mmap", "ragwort-compiler/mmap", "ragwort-native/mmap", "ragwort-scheme/mmap"]
# Keeps each compile's trees in an arena; see ragwort-compiler.
arena = ["ragwort-compiler/arena", "ragwort-native/arena", "ragwort-scheme/arena"]

[lints]
workspace = true
