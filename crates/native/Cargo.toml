[package]
name = "ragwort-native"
version = "0.1.0"
edition = "2024"

[dependencies]
ragwort-types = { path = "../types", default-features = false }
ragwort-reader = { path = "../reader", default-features = false }
ragwort-vm = { path = "../vm", default-features = false }
ragwort-compiler = { path = "../compiler", default-features = false }

[features]
default = ["mmap"]
mmap = ["ragwort-types/mmap", "ragwort-reader/mmap", "ragwort-vm/mmap", "ragwort-compiler/mmap"]

[lints]
workspace = true
