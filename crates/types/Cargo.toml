[package]
name = "ragwort-types"
version = "0.1.0"
edition = "2024"

[dependencies]
ragwort-derive = { path = "../derive" }
ragwort-gc-region = { path = "../gc-region" }
ragwort-num = { path = "../num" }
ragwort-string = { path = "../string" }

[features]
default = ["mmap"]
# Gives freed pages back to the system. The unsafe code for it is in ragwort-gc-region.
mmap = ["ragwort-gc-region/mmap"]

[lints]
workspace = true
