[package]
name = "ragwort-types"
version = "0.1.0"
edition = "2024"

[dependencies]
ragwort-gc = { path = "../gc", default-features = false }
ragwort-num = { path = "../num" }
ragwort-string = { path = "../string" }

[features]
default = ["mmap"]
mmap = ["ragwort-gc/mmap"]
gc-verify = ["ragwort-gc/gc-verify"]
gc-hardened = ["ragwort-gc/gc-hardened"]

[lints]
workspace = true
