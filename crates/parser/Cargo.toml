[package]
name = "ragwort-parser"
version = "0.1.0"
edition = "2024"

[dependencies]
ragwort-types = { path = "../types", default-features = false }

[features]
default = ["mmap"]
mmap = ["ragwort-types/mmap"]
gc-verify = ["ragwort-types/gc-verify"]
gc-hardened = ["ragwort-types/gc-hardened"]

[lints]
workspace = true
