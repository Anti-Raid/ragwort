[package]
name = "ragwort-scheme"
version = "0.1.0"
edition = "2024"

[dependencies]
ragwort-types = { path = "../../types", default-features = false }
ragwort-reader-scheme = { path = "../reader", default-features = false }
ragwort-vm = { path = "../../vm", default-features = false }
ragwort-compiler = { path = "../../compiler", default-features = false }

[dev-dependencies]
ragwort-native = { path = "../../native", default-features = false }
ragwort-printer-scheme = { path = "../printer", default-features = false }

[features]
default = ["mmap"]
mmap = ["ragwort-types/mmap", "ragwort-reader-scheme/mmap", "ragwort-vm/mmap", "ragwort-compiler/mmap"]

[lints]
workspace = true
