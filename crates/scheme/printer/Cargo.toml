[package]
name = "ragwort-printer-scheme"
version = "0.1.0"
edition = "2024"

[dependencies]
ragwort-types = { path = "../../types", default-features = false }
ragwort-vm = { path = "../../vm", default-features = false }
ragwort-parser-scheme = { path = "../parser" }

[features]
default = ["mmap"]
